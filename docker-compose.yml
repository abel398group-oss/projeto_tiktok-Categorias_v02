# Stack API (Fastify + Prisma) + Nginx (SPA Vite build).
#
# Sem publicação de portas no host — adequado a EasyPanel / Traefik (ligação à rede interna
# do contentor `web` na porta 80; API só em rede Docker na 3333).
#
# Local ou VM com acesso directo por IP:porta no host:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Ou (equivalente):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml docker compose up -d --build
#
# EasyPanel: usar este ficheiro ou `docker-compose.easypanel.yml` (include deste).
#
# `.env` na raiz: DATABASE_URL, ANALYTICS_API_KEY; build do frontend: VITE_ANALYTICS_API_KEY
# (ver `.env.example`, docs/DOCKER.md).

name: tiktok-analytics

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      ANALYTICS_API_HOST: "0.0.0.0"
      ANALYTICS_API_PORT: "3333"
    expose:
      - "3333"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_ANALYTICS_API_KEY: ${VITE_ANALYTICS_API_KEY:-}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health | grep -q '\"ok\":true' || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
