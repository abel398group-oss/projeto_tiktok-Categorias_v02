# Publica o Nginx (`web`) no host — desenvolvimento local, testes na VM ou Droplet sem Traefik.
# Não usar no EasyPanel quando o painel faz o roteamento interno (sem `ports` no stack base).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Porta no host: `COMPOSE_WEB_PORT` no `.env` (defeito 8080).

services:
  web:
    ports:
      - "${COMPOSE_WEB_PORT:-8080}:80"
