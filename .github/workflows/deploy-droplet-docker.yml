# Deploy ao Droplet (Docker Compose) ao dar push em `main` ou pelo botão "Run workflow".
#
# PRÉ‑REQUISITO (uma vez, no servidor): clone em /var/www/tiktok-analytics, `.env` com DATABASE_URL etc.,
# Docker instalado, `docker compose` a funcionar.
#
# SEGREDOS GitHub → Settings → Secrets and variables → Actions → Repository secrets:
#   DROPLET_HOST      → ex. 146.190.71.12
#   DROPLET_USER      → ex. root
#   DROPLET_SSH_KEY   → chave PRIVADA completa (PEM), a que faz par com a pública em ~/.ssh no Droplet
#   DROPLET_DEPLOY_PATH (opcional) → ex. /var/www/tiktok-analytics ; se omitir usa o caminho abaixo
#
# Como gerar/registar a chave no Droplet:
#   No PC: ssh-keygen -t ed25519 -f deploy_ci -N ""
#   No servidor (uma vez): echo "pubkey linha..." >> ~/.ssh/authorized_keys
#   Em GitHub: cola o conteúdo inteiro do ficheiro `deploy_ci` (privado) em DROPLET_SSH_KEY
#
name: Deploy Droplet (Docker)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: git pull + docker compose
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_DEPLOY_PATH: ${{ secrets.DROPLET_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DROPLET_HOST:?defina DROPLET_HOST}"
          : "${DROPLET_USER:?defina DROPLET_USER}"
          REMOTE_PATH="${DROPLET_DEPLOY_PATH:-/var/www/tiktok-analytics}"
          ssh -o StrictHostKeyChecking=accept-new "${DROPLET_USER}@${DROPLET_HOST}" bash -s << REMOTE_EOF
          set -euo pipefail
          cd "${REMOTE_PATH}"
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker compose ps
          WEB_HOST_PORT=$(docker compose port web 80 2>/dev/null | awk -F: '{print $NF}')
          curl -sf "http://127.0.0.1:${WEB_HOST_PORT:-8080}/health" | head -c 200 || true
          REMOTE_EOF
