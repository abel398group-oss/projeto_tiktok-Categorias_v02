# Exemplo — copiar para /etc/nginx/sites-available/ e personalizar server_name + root.
# A API Fastify escuta em 127.0.0.1:3333 com ANALYTICS_API_HOST=127.0.0.1

server {
    listen 80;
    listen [::]:80;
    server_name tiktok-seu-subdominio.exemplo.com;

    # Builds: cd frontend && npm run build → dist aqui em baixo (caminho absoluto no servidor)
    root /opt/projeto_tiktok-Categorias_v02/frontend/dist;
    index index.html;

    # SPA React Router — refrescar qualquer rota sem 404 nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /analytics {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ZIP/body maiores nos POST (imagens workspace, etc.)
        client_max_body_size 32m;
        proxy_read_timeout 120s;
    }

    location /scrape {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 7200s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3333/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
